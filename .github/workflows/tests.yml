name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Site scripts parse
        run: for f in site/*.js; do node --check "$f" || exit 1; done
      - name: JavaScript tests (food sheet Apps Script, lift search)
        run: for f in tests/js/*.test.js; do node "$f" || exit 1; done
